<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>도서 추가 - 도서관리 서비스</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="my.css">
</head>
<body>

  <nav class="navbar navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="index.html">📚 도서관리 서비스</a>
    </div>
  </nav>

  <div class="container my-5" style="max-width: 600px;">
    <h1 class="mb-4">도서 추가</h1>

    <form id="addForm" class="needs-validation" novalidate>

      <div class="mb-3">
        <label for="title" class="form-label">도서명 *</label>
        <input type="text" class="form-control" id="title" required minlength="2" maxlength="100">
        <div class="invalid-feedback">도서명을 2자 이상 입력해주세요.</div>
      </div>

      <div class="mb-3">
        <label for="author" class="form-label">저자 *</label>
        <input type="text" class="form-control" id="author" required>
        <div class="invalid-feedback">저자를 입력해주세요.</div>
      </div>

      <div class="mb-3">
        <label for="publisher" class="form-label">출판사</label>
        <input type="text" class="form-control" id="publisher">
      </div>

      <div class="mb-3">
        <label for="year" class="form-label">출판년도 *</label>
        <input type="number" class="form-control" id="year" required min="1000" max="2026">
        <div class="invalid-feedback">1000~2026 사이의 연도를 입력해주세요.</div>
      </div>

      <div class="mb-3">
        <label for="isbn" class="form-label">ISBN *</label>
        <input type="text" class="form-control" id="isbn" required pattern="[0-9\-]{10,17}">
        <div class="invalid-feedback">숫자와 하이픈(-)으로 된 ISBN을 입력해주세요.</div>
      </div>

      <div class="mb-3">
        <label for="category" class="form-label">카테고리 *</label>
        <select class="form-select" id="category" required>
          <option value="">선택하세요</option>
          <option value="컴퓨터/IT">컴퓨터/IT</option>
          <option value="인문학">인문학</option>
          <option value="소설">소설</option>
          <option value="과학">과학</option>
        </select>
        <div class="invalid-feedback">카테고리를 선택해주세요.</div>
      </div>

      <button type="submit" class="btn btn-primary">추가</button>
      <a href="index.html" class="btn btn-outline-secondary">목록으로</a>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const form = document.getElementById('addForm');
    form.addEventListener('submit', function (event) {
      event.preventDefault();
      event.stopPropagation();

      if (form.checkValidity()) {
        alert('게시물이 추가됩니다.');
        window.location.href = 'index.html';
      }

      form.classList.add('was-validated');
    });
  </script>
</body>
</html>
