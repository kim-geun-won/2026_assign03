<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>도서 상세보기 - 도서관리 서비스</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="my.css">
</head>
<body>

  <nav class="navbar navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="index.html">📚 도서관리 서비스</a>
    </div>
  </nav>

  <div class="container my-5" style="max-width: 600px;">
    <h1 class="mb-4">도서 상세보기</h1>

    <div class="card">
      <div class="card-body">
        <table class="table">
          <tbody>
            <tr><th style="width: 30%;">도서명</th><td>클린 코드</td></tr>
            <tr><th>저자</th><td>로버트 마틴</td></tr>
            <tr><th>출판사</th><td>인사이트</td></tr>
            <tr><th>출판년도</th><td>2013</td></tr>
            <tr><th>ISBN</th><td>978-89-6626-045-0</td></tr>
            <tr><th>카테고리</th><td>컴퓨터/IT</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="mt-4 d-flex gap-2">
      <a href="edit.html" class="btn btn-primary">Edit</a>
      <button type="button" class="btn btn-danger" onclick="deleteBook()">Delete</button>
      <a href="index.html" class="btn btn-outline-secondary">목록으로</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    function deleteBook() {
      if (confirm('정말 이 책을 삭제하시겠습니까?')) {
        alert('게시물이 삭제되었습니다.');
        window.location.href = 'index.html';
      }
    }
  </script>
</body>
</html>
